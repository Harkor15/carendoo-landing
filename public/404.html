<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carendoo</title>
    <script>
      // Redirect all SPA routes to index.html while preserving query parameters and hash fragments
      const l = window.location;
      const path = l.pathname.replace(/\/$/, '');
      if (path && !path.includes('.')) {
        sessionStorage.redirect = l.pathname + l.search + l.hash;
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
